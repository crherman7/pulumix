name: hello-world

backend:
  type: file
  path: dist/

stacks:
  local:
    namespace: hello-world
    kubeContext: k3d-hello-world
    hostRegistry: localhost:5001
    clusterRegistry: hello-world-registry:5000

  production:
    namespace: hello-world-prod
    kubeContext: production-cluster

hooks:
  local:
    - stage: pre-build
      run: "./scripts/ensure-cluster.sh"
      description: k3d Cluster
      env:
        CLUSTER_NAME: hello-world
        REGISTRY_PORT: "5001"
        LB_PORT: "80"
