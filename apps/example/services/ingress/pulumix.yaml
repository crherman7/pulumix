# Ingress Service
# Installs ingress controller (traefik, nginx, etc.)

metadata:
  name: ingress
  version: 1.0.0
  description: Ingress controller service
  team: platform
  contract:
    version: 1.0.0

stacks:
  local:
    # k3d includes traefik - skip installation
    install: false

  production:
    install: true
    type: traefik
    replicas: 2
    namespace: traefik-system
    helmRepo: https://traefik.github.io/charts
    helmChart: traefik
    dashboardEnabled: false
