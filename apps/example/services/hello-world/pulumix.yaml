# Hello World Service

metadata:
  name: hello-world
  version: 1.0.0
  description: Hello World HTTP service
  team: platform
  owner: platform@example.com
  repository: https://github.com/yourorg/hello-world
  tags:
    tier: frontend
    criticality: low
  sla:
    availability: 99.9%
    responseTime: 200ms
  support:
    slack: "#platform-support"
  contract:
    version: 1.0.0

observability:
  health:
    endpoint: /health
    port: 3000
    scheme: http
  metrics:
    endpoint: /metrics
    port: 3000
    format: prometheus
  logs:
    format: json
    level: info

dev:
  command: node --watch index.js
  port: 3000
  cwd: src

stacks:
  local:
    # Runtime configuration (varies per environment)
    replicas: 5
    baseDomain: '127.0.0.1.sslip.io'
    ingressClassName: 'traefik'
    imagePullPolicy: 'IfNotPresent'
    env:
      NODE_ENV: development

  staging:
    replicas: 3
    baseDomain: 'staging.example.com'
    ingressClassName: 'traefik'
    imagePullPolicy: 'Always'
    env:
      NODE_ENV: staging

  production:
    replicas: 5
    baseDomain: 'example.com'
    ingressClassName: 'traefik'
    imagePullPolicy: 'Always'
    env:
      NODE_ENV: production
