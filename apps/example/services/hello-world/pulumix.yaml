metadata:
  name: hello-world
  version: 1.0.0

stacks:
  local:
    baseDomain: '127.0.0.1.sslip.io'
    ingressClassName: 'traefik'
    env:
      NODE_ENV: development

  staging:
    baseDomain: 'staging.example.com'
    ingressClassName: 'nginx'
    env:
      NODE_ENV: staging

  production:
    baseDomain: 'example.com'
    ingressClassName: 'nginx'
    env:
      NODE_ENV: production
